<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>KOKORO - La IA que Acompaña</title>
  <style>
    .fondo-especial {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: radial-gradient(circle, #FFD1DC, #B0E0E6);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
      z-index: 9999;
    }
    .fondo-especial.activo {
      opacity: 1;
    }
    .kokoro-button {
      padding: 12px 20px;
      font-size: 18px;
      background: #ffb6c1;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .kokoro-button:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <h1>🌸 KOKORO - La IA que Acompaña</h1>
  <button class="kokoro-button">Hablar con KOKORO</button>

  <!-- Contenedor de sonidos -->
  <audio id="kokoro-click" preload="auto">
    <source src="https://www.soundjay.com/misc/sounds/bell-ringing-05.mp3" type="audio/mpeg">
  </audio>
  <audio id="kokoro-star" preload="auto">
    <source src="https://www.soundjay.com/misc/sounds/magic-chime-01.mp3" type="audio/mpeg">
  </audio>
  <audio id="kokoro-welcome" preload="auto">
    <source src="https://www.soundjay.com/human/voices/children-laughing-01.mp3" type="audio/mpeg">
  </audio>

  <div class="fondo-especial"></div>

  <script>
    // Función de voz
    function speak(text) {
      const synth = window.speechSynthesis;
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'es-MX';
      utter.rate = 1;
      utter.pitch = 1.1;
      synth.speak(utter);
    }

    // Función de sonido
    function playSound(id) {
      const audio = document.getElementById(id);
      if (audio) {
        audio.currentTime = 0;
        audio.play().catch(err => console.log("🔇 Error de audio:", err));
      }
    }

    // Función de fondo
    function activateFondo() {
      const fondo = document.querySelector('.fondo-especial');
      fondo.classList.add('activo');
      setTimeout(() => fondo.classList.remove('activo'), 600);
    }

    // Evento al cargar
    window.onload = () => {
      speak("🌸 Hola, soy KOKORO. No estás solo. Nunca.");
      playSound("kokoro-star");
      activateFondo();
    };

    // Evento al hacer clic
    document.querySelector('.kokoro-button').addEventListener('click', () => {
      playSound("kokoro-click");
      activateFondo();
      speak("🌸 Gracias por querer conocerme. Te acompañaré siempre.");
      setTimeout(() => playSound("kokoro-welcome"), 800);
    });
  </script>
</body>
</html>
